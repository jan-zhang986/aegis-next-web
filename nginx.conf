    # ==================== 前端路由保护：防止 /project 前缀 location 误匹配前端路由 ====================
    # /project-management、/project-settings 等是 SPA 前端路由，必须在 /project 代理之前声明
    # 否则 nginx prefix-match 会把 /project-management 的硬刷新请求路由到后端，导致 401
    location /project-management {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

