server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 允许上传大文件（知识库文件上传等），nginx 默认 1MB 会导致 413 错误
    client_max_body_size 50m;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # ==================== AegisAgent/RAG 后端代理（aegis-rag-backend）====================
    # 后端地址：http://aegis-rag.tst.spotter.ink（生产环境）
    # 本地环境：http://localhost:8082（开发环境，通过 vite.config.ts 代理）
    
    # 必须放在最前面，确保优先匹配，避免被 /login 等规则误匹配
    # /rag/v1/* -> RAG 后端
    location /rag/v1/ {
        proxy_pass http://aegis-rag.tst.spotter.ink/rag/v1/;
        proxy_set_header Host aegis-rag.tst.spotter.ink;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE/流式输出必需：禁用缓冲，确保每个 chunk 实时推送到前端
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # 剥掉 Origin 头：RAG 后端 CORS 中间件未放行前端域名，带 Origin 会导致 403
        # CORS 由 nginx 自身的 add_header 处理即可
        proxy_set_header Origin '';

        # OPTIONS 预检由 nginx 直接返回 204（add_header 放在 if 内部，确保跟随 return 一起生效）
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-AUTH-TOKEN, CSRF-TOKEN, X-API-Key, X-User-ID' always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-AUTH-TOKEN, CSRF-TOKEN, X-API-Key, X-User-ID' always;
    }

    # /api/v1 全部 RAG 路径 -> RAG 后端
    # 覆盖 sessions、knowledge-chat、agent-chat、messages 等所有 RAG Chat API
    location /api/v1/ {
        proxy_pass http://aegis-rag.tst.spotter.ink/api/v1/;
        proxy_set_header Host aegis-rag.tst.spotter.ink;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE/流式输出必需：禁用缓冲，确保每个 chunk 实时推送到前端
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # 剥掉 Origin 头：RAG 后端 CORS 中间件未放行前端域名，带 Origin 会导致 403
        proxy_set_header Origin '';

        # OPTIONS 预检由 nginx 直接返回 204
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-AUTH-TOKEN, CSRF-TOKEN, X-API-Key, X-User-ID' always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-AUTH-TOKEN, CSRF-TOKEN, X-API-Key, X-User-ID' always;
    }

    # ==================== MeterSphere 后端代理（用例模块 API）====================
    # 后端地址：http://aegis.tst.spotter.ink（生产环境）
    # 本地环境：http://localhost:8080（开发环境，通过 vite.config.ts 代理）
    
    # metrics API 代理（dashboard、efficiency/overview、efficiency/activity、需求质量流水线上报等，统一走 /metrics）
    # 包含：/metrics/requirement-quality/pipeline/report（云效流水线 POST 上报，运维 curl 回调）
