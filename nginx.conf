        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-AUTH-TOKEN, CSRF-TOKEN, ORGANIZATION, PROJECT' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ==================== 附件下载代理（执行历史图片等，必须转发到后端，否则返回 index.html 导致破图）====================
    # 线上请求 /attachment/download/file/... 若未配置会命中 SPA 的 try_files，返回 text/html 463 字节
    location /attachment/ {
        proxy_pass http://aegis.tst.spotter.ink;
        proxy_set_header Host aegis.tst.spotter.ink;
        proxy_set_header X-Real-IP $remote_addr;
