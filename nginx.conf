    # ==================== 通用 /api 代理（用例管理、测试计划等 POST 请求必须经此转发，否则生产会 405）====================
    # 本地开发：vite 代理会把 /api 转发到后端；生产：必须由 nginx 把 /api/* 转发到后端，且允许 POST
    # 若生产仍 405，请检查实际使用的 nginx/ingress 是否包含本段或等效配置
    location /api/ {
        proxy_pass http://aegis.tst.spotter.ink/;
        proxy_set_header Host aegis.tst.spotter.ink;
        proxy_set_header X-Real-IP $remote_addr;
