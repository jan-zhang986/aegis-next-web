        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-AUTH-TOKEN, CSRF-TOKEN, ORGANIZATION, PROJECT' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 静态资源目录（必须在 SPA 路由之前，使用 ^~ 前缀匹配，优先级最高）
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 文件不存在时返回 404，不要回退到 index.html
        try_files $uri =404;
    }

    # 匹配所有 JS/MJS 文件（必须在 SPA 路由之前）
    # 使用正则匹配，确保所有 .js 和 .mjs 文件都被正确识别
    location ~* \.(js|mjs)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 明确设置 Content-Type
        default_type application/javascript;
        # 文件不存在时返回 404，不要返回 HTML
        try_files $uri =404;
        # 确保返回正确的状态码和内容类型
        add_header Content-Type "application/javascript; charset=utf-8" always;
    }

    # 匹配所有 CSS 文件
    location ~* \.css$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        default_type text/css;
        try_files $uri =404;
        add_header Content-Type "text/css; charset=utf-8" always;
    }

    # 其他静态资源
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，确保总是获取最新版本
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA 路由支持：所有路由都返回 index.html（必须在最后）
    # 包含 /test-plan、/test-plan/:planId（测试计划列表/详情）等前端路由，不要单独代理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

